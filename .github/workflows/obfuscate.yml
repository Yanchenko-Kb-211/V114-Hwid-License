name: Obfuscate Minecraft mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  obfuscate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download ProGuard 7.10.0
        run: |
          curl -L --fail --silent --show-error             -o proguard.zip             https://github.com/Guardsquare/proguard/releases/download/v7.10.0/proguard-7.10.0.zip
          unzip -q proguard.zip -d tools

      - name: Prepare Java bytecode patcher
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error             -o asm.jar             https://repo1.maven.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar
          mkdir -p build/classes
          javac -d build/classes tools/LicenseProofClient.java
          javac -cp asm.jar tools/TransitionResetPatch.java tools/LicenseSecurityPatch.java

      - name: Patch restart transition state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/input

          java -cp "tools:asm.jar" TransitionResetPatch             Homka-Avto-Farm_Hwid.jar             build/input/patched.jar

      - name: Integrate signed HWID proof
        shell: bash
        run: |
          set -euo pipefail
          java -cp "tools:asm.jar" LicenseSecurityPatch \\
            build/input/patched.jar \\
            build/input/secured.jar \\
            build/classes/com/example/chestdropper/LicenseProofClient.class

      - name: Prepare clean input JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/input/unpacked

          cp build/input/secured.jar build/input/source.jar
          unzip -q build/input/source.jar -d build/input/unpacked

          # Normalize archive permissions.
          chmod -R u+rwX build/input/unpacked

          # Remove build/debug dumps. They are not needed by Fabric.
          find build/input/unpacked -type f -name '*.javap' -delete

          # Remove old Java signature metadata when present.
          rm -f build/input/unpacked/META-INF/*.SF                 build/input/unpacked/META-INF/*.RSA                 build/input/unpacked/META-INF/*.DSA || true

          (
            cd build/input/unpacked
            zip -qr ../clean.jar .
          )

      - name: Obfuscate
        shell: bash
        run: |
          set -euo pipefail
          ./tools/proguard-7.10.0/bin/proguard.sh @proguard.pro

      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail
          test -f build/Homka-Avto-Farm_Hwid_OBF.jar

          mkdir -p build/verify
          unzip -q build/Homka-Avto-Farm_Hwid_OBF.jar -d build/verify

          test -f build/verify/fabric.mod.json
          test -f build/verify/assets/chestdropper/icon.png

          if find build/verify -type f -name '*.javap' | grep -q .; then
            echo 'ERROR: .javap debug dumps are still present'
            exit 1
          fi

          echo '--- Obfuscated class files ---'
          find build/verify -type f -name '*.class' | sort

          echo '--- Fabric entrypoints after adaptation ---'
          sed -n '1,180p' build/verify/fabric.mod.json

          echo '--- SHA-256 ---'
          sha256sum build/Homka-Avto-Farm_Hwid_OBF.jar

      - name: Upload protected JAR
        uses: actions/upload-artifact@v4
        with:
          name: Homka-Avto-Farm_Hwid_OBF
          path: build/Homka-Avto-Farm_Hwid_OBF.jar
          if-no-files-found: error
          retention-days: 30
